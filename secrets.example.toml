# Paste into the app's Secrets on Streamlit Community Cloud (Settings > Secrets). Never commit real values.

# Google accounts that may see and edit every customer and the orb table
admins = ["you@gmail.com"]

# A hosted Postgres database (e.g. Neon or Supabase, free tiers): the app's own disk is wiped on every restart
db_url = "postgresql+psycopg2://USER:PASSWORD@HOST/DBNAME?sslmode=require"

# Sign-in with Google (Google Cloud console > APIs & Services > Credentials > OAuth client ID, type Web application,
# authorised redirect URI = redirect_uri below)
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "a long random string - generate one, never reuse"
client_id = "XXXXXXXX.apps.googleusercontent.com"
client_secret = "XXXXXXXX"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
